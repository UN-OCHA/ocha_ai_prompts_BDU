# Every link the prompts use, in one place. Prompts write {{link:name}}; the build fills in the URL.
#
# Brand site pages use Frontify's permanent links (/r/…): they keep working when a page is renamed
# or moved to another category, which the readable #/category/page links don't. To get one, open
# the page in the brand site editor and copy its permanent link, or read `permanent_link` from
# the Frontify API (GET /api/document-page/<page id>). The page each link opens is noted on its line.

